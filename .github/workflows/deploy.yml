name: Deploy React App to Aissa Dev Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Vite React app
      run: npm run build
      env:
        CI: false
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Backup current version
          if [ -d "/var/www/rayfly-webapp" ]; then
            sudo cp -r /var/www/rayfly-webapp /var/www/rayfly-webapp-backup-$(date +%Y%m%d-%H%M%S)
          fi
          
          # Create directory if it doesn't exist
          sudo mkdir -p /var/www/rayfly-webapp
          
          # Set proper ownership
          sudo chown -R $USER:$USER /var/www/rayfly-webapp
          
          # Remove old files
          rm -rf /var/www/rayfly-webapp/*
          
    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        source: "./dist/*"
        target: "/var/www/rayfly-webapp/"
        strip_components: 1
        
    - name: Start/Restart web server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.PRIVATE_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Set proper permissions
          chown -R www-data:www-data /var/www/rayfly-webapp
          chmod -R 755 /var/www/rayfly-webapp
          
          systemctl reload nginx
          
          echo "Deployment completed successfully!"
